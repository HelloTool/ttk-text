name: Linting

on:
  push:
    branches:
      - "releases/**"
    paths:
      - "**.py"
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Do not use uv run --group lint because reportMissingImports
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Check code
        run: uv run ruff check
      - name: Check format
        run: uv run ruff format --check
      - name: Check type
        run: uv run pyright
